# Local infrastructure for the Forum Reporting prototype.
# Credentials below are LOCAL DEVELOPMENT DEFAULTS only. Ports are bound to localhost.
# Note: postgres/init.sql runs only on an EMPTY data volume; use `docker compose down -v` to re-run it.
name: forum-reporting

services:
  postgres:
    image: postgres:17.12
    environment:
      POSTGRES_USER: forum
      POSTGRES_PASSWORD: forum
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5433:5432"   # 5433 on the host: a local PostgreSQL service already owns 5432
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready ignores -d, and the temporary first-init server listens only on the unix socket.
      # Querying both databases over TCP proves init.sql has finished and the real server is up.
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U forum -d reporting_db -c 'select 1' && psql -h 127.0.0.1 -U forum -d account_db -c 'select 1'"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.4-management
    # Fixed hostname => stable node name (rabbit@rabbitmq), so durable queues/messages
    # in the data volume survive `docker compose down && up`.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: forum
      RABBITMQ_DEFAULT_PASS: forum
    ports:
      - "127.0.0.1:5672:5672"     # AMQP
      - "127.0.0.1:15672:15672"   # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  rabbitmq-data:
